name: Publish to npm

# Trusted Publishing (OIDC): no NPM_TOKEN. Configure the publisher on npmjs.com
# (Package → Settings → Trusted Publisher → GitHub Actions): piique/text-bubbles,
# workflow "publish.yml". Release: bump the version, then push a "vX.Y.Z" tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs prepublishOnly (typecheck, test, build, size) then publishes with provenance.
      - run: npm publish --access public
